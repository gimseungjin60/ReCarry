<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RECARRY — 버려지는 캐리어를 다시 여행으로</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter+Tight:wght@300;400;500;600&family=Noto+Sans+KR:wght@300;400;500&display=swap">
<style>
/* ============ RECARRY — tokens ============ */
:root{
  --paper:#ffffff;
  --canvas:#f6f4ef;
  --stone:#e9e5dd;
  --sand:#e3d8c5;
  --sand-deep:#cdbca1;
  --ink:#141413;
  --charcoal:#2b2b29;
  --ink-muted:#5f5e5a;
  --hairline:#dedad2;
  --line-strong:#8c8880;
  --sand-ink:#5a5142;
  --forest:#1e3b2f;
  --forest-line:#3f5f51;
  --on-forest:#efebe2;
  --on-forest-muted:#b3c0b6;
  --night:#121211;
  --night-raised:#1d1d1b;
  --night-line:#34332f;
  --on-night:#f2efe9;
  --on-night-muted:#a3a098;
  --signal:#c4592b;
  --signal-ink:#a64a22;
  --focus:#141413;

  --font-display:"Inter Tight","Pretendard Variable",Pretendard,"Noto Sans KR","Noto Sans CJK KR",-apple-system,"Apple SD Gothic Neo",sans-serif;
  --font-sans:"Pretendard Variable",Pretendard,"Inter Tight","Noto Sans KR","Noto Sans CJK KR",-apple-system,"Apple SD Gothic Neo",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;

  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;
  --space-7:48px;--space-8:64px;--space-9:96px;--space-10:128px;--space-11:160px;

  --radius-0:0px;--radius-sm:4px;--radius-pill:999px;
  --nav-h:72px;
  --ease:cubic-bezier(.2,.7,.1,1);
}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font-sans);font-size:16px;line-height:1.75;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;word-break:keep-all;overflow-wrap:break-word}
img,svg{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
h1,h2,h3,h4,p{margin:0;font-weight:inherit}

#app{container-type:inline-size;container-name:app;background:var(--paper);min-height:100vh;position:relative}

/* ============ layout ============ */
.wrap{max-width:1440px;margin:0 auto;padding:0 40px}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px}
.sec{padding:var(--space-11) 0}
.sec-tight{padding:var(--space-10) 0}
.blk-forest{background:var(--forest);color:var(--on-forest);--focus:var(--on-forest)}
.blk-night{background:var(--night);color:var(--on-night);--focus:var(--on-night)}
.blk-sand{background:var(--sand)}
.blk-canvas{background:var(--canvas)}

/* ============ type ============ */
.d-xl{font-family:var(--font-display);font-weight:500;font-size:clamp(44px,6.4cqi,100px);line-height:1.04;letter-spacing:-.045em}
.d-l{font-family:var(--font-display);font-weight:500;font-size:clamp(34px,4.4cqi,68px);line-height:1.12;letter-spacing:-.04em}
.d-m{font-family:var(--font-display);font-weight:500;font-size:clamp(28px,3cqi,44px);line-height:1.2;letter-spacing:-.03em}
.d-latin{font-family:"Inter Tight",var(--font-display);font-weight:400;font-size:clamp(48px,8.4cqi,136px);line-height:.92;letter-spacing:-.05em;text-transform:uppercase}
.t-title{font-size:22px;line-height:1.4;font-weight:500;letter-spacing:-.02em}
.lead{font-size:18px;line-height:1.75;color:var(--charcoal)}
.small{font-size:14px;line-height:1.65;color:var(--ink-muted)}
.label{font-family:"Inter Tight",var(--font-sans);font-size:12px;line-height:16px;letter-spacing:.14em;text-transform:uppercase;font-weight:500}
.mono{font-family:var(--font-mono);font-size:12px;line-height:18px;letter-spacing:.02em}
.muted{color:var(--ink-muted)}
.blk-forest .muted{color:var(--on-forest-muted)}
.blk-night .muted{color:var(--on-night-muted)}
.idx{display:flex;gap:12px;align-items:center;color:var(--ink-muted)}
.idx::after{content:"";width:40px;height:1px;background:currentColor;opacity:.5}
.blk-forest .idx{color:var(--on-forest-muted)}
.blk-night .idx{color:var(--on-night-muted)}

/* ============ buttons ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;height:52px;padding:0 26px;border-radius:var(--radius-pill);
  font-size:15px;font-weight:500;letter-spacing:-.01em;border:1px solid transparent;white-space:nowrap;transition:background .25s var(--ease),color .25s var(--ease),border-color .25s}
.btn .arr{transition:transform .3s var(--ease)}
.btn:hover .arr{transform:translateX(4px)}
.btn-primary{background:var(--ink);color:var(--paper)}
.btn-primary:hover{background:#000}
.btn-secondary{border-color:var(--ink);color:var(--ink)}
.btn-secondary:hover{background:var(--ink);color:var(--paper)}
.btn-light{background:var(--paper);color:var(--ink)}
.btn-light:hover{background:var(--sand)}
.btn-sm{height:40px;padding:0 18px;font-size:14px}
.btn-block{width:100%}
.btn[disabled]{background:var(--hairline);color:var(--ink-muted);cursor:not-allowed}
.link{text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px}
.link-arrow{display:inline-flex;gap:8px;align-items:center;font-size:15px;font-weight:500;border-bottom:1px solid currentColor;padding-bottom:3px}
.link-arrow .arr{transition:transform .3s var(--ease)}
.link-arrow:hover .arr{transform:translateX(4px)}

/* tag */
.tag{display:inline-flex;align-items:center;height:24px;padding:0 8px;border:1px solid currentColor;border-radius:var(--radius-sm);
  font-family:"Inter Tight",var(--font-sans);font-size:11px;letter-spacing:.12em;font-weight:500;text-transform:uppercase}
.tag-solid{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* ============ nav ============ */
.nav{position:sticky;top:0;z-index:40;background:var(--paper);transition:border-color .3s;border-bottom:1px solid transparent}
.nav.is-scrolled{border-bottom-color:var(--hairline)}
.nav-in{height:var(--nav-h);display:flex;align-items:center;justify-content:space-between;gap:24px}
.logo{font-family:"Inter Tight",var(--font-sans);font-size:18px;letter-spacing:.08em;font-weight:600;display:inline-flex;align-items:baseline}
.logo .re{font-weight:300}
.nav-links{display:flex;gap:40px;position:absolute;left:50%;transform:translateX(-50%)}
.nav-links a{font-family:"Inter Tight",var(--font-sans);font-size:12px;letter-spacing:.14em;font-weight:500;padding:6px 0;border-bottom:1px solid transparent}
.nav-links a:hover{border-bottom-color:var(--ink)}
.nav-menu{display:none;font-size:14px;font-weight:500}
.menu-sheet{position:fixed;inset:0;background:var(--paper);z-index:60;display:none;flex-direction:column;padding:0 20px 32px}
.menu-sheet.open{display:flex}
.menu-sheet .mlinks{display:flex;flex-direction:column;margin-top:32px}
.menu-sheet .mlinks a{font-family:var(--font-display);font-size:36px;letter-spacing:-.03em;font-weight:500;padding:14px 0;border-bottom:1px solid var(--hairline)}

/* ============ media frames ============ */
.frame{position:relative;overflow:hidden;background:var(--stone);display:flex;align-items:flex-end;justify-content:center}
.frame svg.bag{height:78%;width:auto;margin-bottom:6%;transition:transform .8s var(--ease)}
.frame .corner{position:absolute;top:20px;left:20px;right:20px;display:flex;justify-content:space-between;align-items:flex-start}

/* ============ HERO ============ */
.hero{padding-top:24px;padding-bottom:var(--space-8)}
.hero .grid{align-items:stretch;min-height:min(calc(100vh - var(--nav-h) - 88px),800px)}
.hero-copy{grid-column:1/6;display:flex;flex-direction:column;justify-content:space-between;padding:40px 0 8px}
.hero-copy .lead{margin-top:32px;max-width:400px}
.hero-actions{display:flex;gap:24px;align-items:center;margin-top:48px;flex-wrap:wrap}
.hero-loop{display:flex;flex-wrap:wrap;gap:8px 10px;color:var(--ink-muted);margin-top:64px}
.hero-loop b{color:var(--ink);font-weight:500}
.hero-visual{grid-column:6/13;min-height:560px}
.hero-visual svg.bag{height:74%}
.hero-meta{position:absolute;left:24px;bottom:24px;right:24px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px}

/* ============ WHY ============ */
.why-head{grid-column:1/9}
.why-note{grid-column:9/13;align-self:end;max-width:340px}
.why-frames{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;margin-top:var(--space-9)}
.why-frames figure{margin:0}
.why-frames .frame{aspect-ratio:3/4}
.why-frames .frame svg.bag{height:62%}
.why-frames figcaption{padding-top:20px;border-top:1px solid var(--ink);margin-top:20px}
.why-frames figcaption .t{font-size:18px;font-weight:500;letter-spacing:-.02em;margin:6px 0 4px}
.why-rail{display:flex;align-items:center;gap:12px;margin-top:var(--space-8);color:var(--ink-muted)}
.why-rail::before,.why-rail::after{content:"";flex:1;height:1px;background:var(--hairline)}

/* ============ PROCESS ============ */
.proc-head{grid-column:1/8}
.proc-head p{margin-top:24px;max-width:420px}
.proc-body{margin-top:var(--space-9);align-items:center}
.ring-wrap{grid-column:1/7;position:relative;aspect-ratio:1/1;max-width:560px;width:100%}
.ring-wrap svg{width:100%;height:100%}
.ring-track{fill:none;stroke:var(--forest-line);stroke-width:1}
.ring-prog{fill:none;stroke:var(--on-forest);stroke-width:1.5;transition:stroke-dashoffset .9s var(--ease)}
.ring-node{fill:var(--forest);stroke:var(--on-forest-muted);stroke-width:1;transition:all .4s}
.ring-node.done{fill:var(--on-forest);stroke:var(--on-forest)}
.ring-label{fill:var(--on-forest-muted);font-family:"Inter Tight",sans-serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.ring-label.on{fill:var(--on-forest)}
.ring-traveler{transition:transform .9s var(--ease)}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.ring-center .n{font-family:var(--font-mono);font-size:13px;color:var(--on-forest-muted)}
.ring-center .w{font-family:var(--font-display);font-size:clamp(36px,4cqi,60px);letter-spacing:-.04em;font-weight:500;line-height:1.1;margin-top:8px}
.ring-center .e{font-family:"Inter Tight",sans-serif;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--on-forest-muted);margin-top:10px}
.proc-list{grid-column:8/13;list-style:none;margin:0;padding:0}
.proc-list li{border-top:1px solid var(--forest-line)}
.proc-list li:last-child{border-bottom:1px solid var(--forest-line)}
.proc-list button{width:100%;text-align:left;display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:baseline;padding:18px 0;color:var(--on-forest-muted);transition:color .3s}
.proc-list .nm{font-size:20px;letter-spacing:-.02em;font-weight:500}
.proc-list .desc{grid-column:2/4;font-size:15px;line-height:1.7;max-height:0;overflow:hidden;opacity:0;transition:max-height .5s var(--ease),opacity .4s}
.proc-list li.on button{color:var(--on-forest)}
.proc-list li.on .desc{max-height:80px;opacity:1;color:var(--on-forest-muted)}

/* ============ COLLECTION ============ */
.col-head{align-items:end}
.col-head .l{grid-column:1/8}
.col-head .r{grid-column:9/13}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin-top:var(--space-8)}
.pcard{display:block}
.pcard .frame{aspect-ratio:4/5}
.pcard .frame svg.bag{height:70%}
.pcard:hover .frame svg.bag{transform:translateY(-10px)}
.pcard-body{padding-top:20px}
.pcard-row{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.pcard-name{font-family:var(--font-display);font-size:24px;letter-spacing:-.03em;font-weight:500}
.pcard-price{font-size:17px;font-weight:500;letter-spacing:-.01em;white-space:nowrap}
.pcard-price small{font-size:13px;color:var(--ink-muted);font-weight:400;margin-left:4px}
.pcard-meta{margin-top:6px;display:flex;gap:10px;align-items:center;color:var(--ink-muted);font-size:14px}
.pcard-checks{margin-top:18px;padding-top:14px;border-top:1px solid var(--hairline);display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--ink-muted)}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--forest);margin-right:8px;vertical-align:middle;position:relative;top:-1px}
.pcard .link-arrow{margin-top:20px}
.grades{margin-top:40px;display:flex;gap:32px;flex-wrap:wrap;font-size:13px;color:var(--ink-muted)}
.grades b{color:var(--ink);font-weight:500;margin-right:8px}

/* ============ STORY ============ */
.story-head{align-items:end}
.story-head .l{grid-column:1/9}
.story-head .r{grid-column:9/13;max-width:360px;justify-self:end}
.story-body{margin-top:var(--space-9);align-items:start}
.compare{grid-column:1/7;position:relative;aspect-ratio:4/5;overflow:hidden;user-select:none;background:#bdb8ae}
.compare .layer{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center}
.compare .layer svg.bag{height:66%;width:auto;margin-bottom:8%}
.compare .before{background:#c9c4ba}
.compare .after{background:var(--stone)}
.compare .lbl{position:absolute;top:20px;font-family:var(--font-mono);font-size:12px;padding:4px 8px;background:var(--night);color:var(--on-night)}
.compare .before .lbl{left:20px}
.compare .after .lbl{right:20px}
.compare .bar{position:absolute;top:0;bottom:0;width:1px;background:var(--paper);pointer-events:none}
.compare .knob{position:absolute;top:50%;left:50%;width:52px;height:52px;border-radius:50%;background:var(--paper);color:var(--ink);transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;font-size:13px;letter-spacing:.05em}
.compare input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
.passport{grid-column:8/13}
.ptag{background:var(--night-raised);border:1px solid var(--night-line);padding:28px;position:relative}
.ptag::before{content:"";position:absolute;top:28px;right:28px;width:14px;height:14px;border-radius:50%;border:1px solid var(--on-night-muted)}
.ptag .id{font-family:var(--font-mono);font-size:30px;letter-spacing:.02em;margin-top:10px}
.ptag dl{display:grid;grid-template-columns:1fr 1fr;gap:18px 24px;margin:28px 0 0;padding-top:22px;border-top:1px dashed var(--night-line)}
.ptag dt{font-family:"Inter Tight",sans-serif;font-size:11px;letter-spacing:.14em;color:var(--on-night-muted);text-transform:uppercase}
.ptag dd{margin:4px 0 0;font-size:15px}
.ptag .stripe{height:8px;background:var(--signal);margin:-28px -28px 24px}
.tl{list-style:none;margin:40px 0 0;padding:0}
.tl li{display:grid;grid-template-columns:96px 1fr;gap:16px;padding:18px 0;border-top:1px solid var(--night-line)}
.tl li:last-child{border-bottom:1px solid var(--night-line)}
.tl .d{font-family:var(--font-mono);font-size:12px;color:var(--on-night-muted);padding-top:3px}
.tl .h{font-size:16px;font-weight:500}
.tl .s{font-size:14px;color:var(--on-night-muted);margin-top:2px}
.tl li.last .h{color:var(--on-night)}
.tl li.last .d{color:var(--signal)}
/* light variant (product page) */
.tl.light li{border-color:var(--hairline)}
.tl.light .d,.tl.light .s{color:var(--ink-muted)}
.tl.light li.last .h{color:var(--ink)}
.tl.light li.last .d{color:var(--signal-ink)}
.frame svg.crop,.pd-thumbs svg.crop{height:100%;width:100%;margin:0}
.err{color:var(--signal-ink);font-size:14px;margin-top:16px;min-height:1px}
.pcard-meta{flex-wrap:wrap;row-gap:0}
.hero-visual svg.bag{height:70%;margin-bottom:11%}

/* ============ WHY RENT ============ */
.rent-l{grid-column:1/6}
.rent-l p{margin-top:28px;max-width:320px}
.rent-r{grid-column:7/13;list-style:none;margin:0;padding:0}
.rent-r li{display:grid;grid-template-columns:56px 1fr;gap:8px 16px;padding:32px 0;border-top:1px solid var(--hairline)}
.rent-r li:last-child{border-bottom:1px solid var(--hairline)}
.rent-r .n{color:var(--ink-muted);padding-top:8px}
.rent-r .t{font-family:var(--font-display);font-size:clamp(24px,2.4cqi,34px);letter-spacing:-.03em;font-weight:500;line-height:1.2}
.rent-r .s{grid-column:2;color:var(--ink-muted);font-size:15px}

/* ============ CTA ============ */
.cta{position:relative;overflow:hidden}
.cta .grid{align-items:end}
.cta-copy{grid-column:1/9;position:relative;z-index:1}
.cta-copy .pre{color:var(--sand-ink)}
.cta-copy .btn{margin-top:56px}
.cta-art{grid-column:9/13;display:flex;justify-content:flex-end;align-self:end;margin-bottom:calc(-1 * var(--space-11))}
.cta-art svg{height:520px;width:auto}

/* ============ footer ============ */
.foot{padding:72px 0 40px;border-top:1px solid var(--hairline)}
.foot .grid>div{grid-column:span 3}
.foot .fl{display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--ink-muted);margin-top:16px}
.foot .fl a:hover{color:var(--ink)}
.foot .bottom{margin-top:72px;display:flex;justify-content:space-between;font-size:13px;color:var(--ink-muted)}

/* ============ PRODUCT ============ */
.crumb{padding:24px 0 20px;font-size:13px;color:var(--ink-muted);display:flex;gap:8px}
.crumb a:hover{color:var(--ink)}
.pd{align-items:start}
.pd-gallery{grid-column:1/8}
.pd-main{aspect-ratio:4/5}
.pd-main svg.bag{height:74%}
.pd-thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:12px}
.pd-thumbs button{aspect-ratio:1/1;background:var(--stone);display:flex;align-items:center;justify-content:center;border:1px solid transparent;overflow:hidden}
.pd-thumbs button.on{border-color:var(--ink)}
.pd-thumbs svg{width:100%;height:100%}
.pd-panel{grid-column:9/13;position:sticky;top:calc(var(--nav-h) + 24px);padding-top:8px}
.pd-panel h1{margin-top:14px}
.pd-meta{display:flex;gap:10px;align-items:center;margin-top:14px}
.pd-price{margin-top:32px;padding-top:24px;border-top:1px solid var(--hairline);display:flex;align-items:baseline;gap:8px}
.pd-price .p{font-size:28px;font-weight:500;letter-spacing:-.02em}
.datebox{margin-top:24px;border:1px solid var(--ink);}
.datebox-btn{width:100%;display:flex;justify-content:space-between;align-items:center;padding:16px 18px;text-align:left}
.datebox-btn .v{font-size:15px;font-weight:500}
.datebox .cal-pop{border-top:1px solid var(--hairline);padding:18px}
.pd-total{display:flex;justify-content:space-between;margin:16px 0 16px;font-size:15px}
.checks{list-style:none;margin:40px 0 0;padding:0}
.checks li{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--hairline);font-size:15px}
.checks li .ok{font-family:var(--font-mono);font-size:12px;color:var(--forest)}
.checks li .ck{margin-right:12px;color:var(--forest)}
.pd-sec{padding:var(--space-10) 0 0}
.spec{grid-column:7/13;margin:0;border-top:1px solid var(--ink)}
.spec div{display:grid;grid-template-columns:140px 1fr;padding:14px 0;border-bottom:1px solid var(--hairline);font-size:15px}
.spec dt{color:var(--ink-muted)}
.spec dd{margin:0}
.steps4{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin-top:48px}
.steps4 div{border-top:1px solid var(--ink);padding-top:18px}
.steps4 .n{font-family:var(--font-mono);font-size:12px;color:var(--ink-muted)}
.steps4 .t{font-size:20px;letter-spacing:-.02em;font-weight:500;margin:28px 0 6px}
.pd-bar{display:none}

/* ============ calendar ============ */
.cal{user-select:none}
.cal-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.cal-top button{width:36px;height:36px;border:1px solid var(--hairline);border-radius:50%;display:flex;align-items:center;justify-content:center}
.cal-top button:hover{border-color:var(--ink)}
.cal-months{display:grid;grid-template-columns:repeat(var(--m,1),1fr);gap:40px}
.cal-m h4{font-size:15px;font-weight:500;margin-bottom:10px}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px}
.cal-g .wd{font-size:11px;color:var(--ink-muted);text-align:center;padding:6px 0}
.cal-g button{height:40px;font-size:14px;position:relative}
.cal-g button:hover:not([disabled]) span{border-color:var(--ink)}
.cal-g button span{display:inline-flex;width:36px;height:36px;border-radius:50%;align-items:center;justify-content:center;border:1px solid transparent}
.cal-g button[disabled]{color:#b9b6ae;cursor:default}
.cal-g button.in{background:var(--stone)}
.cal-g button.s,.cal-g button.e{background:linear-gradient(90deg,transparent 50%,var(--stone) 50%)}
.cal-g button.e{background:linear-gradient(90deg,var(--stone) 50%,transparent 50%)}
.cal-g button.s.e{background:none}
.cal-g button.s span,.cal-g button.e span{background:var(--ink);color:var(--paper)}
.cal-g button.today span{text-decoration:underline;text-underline-offset:3px}
.cal-hint{font-size:13px;color:var(--ink-muted);margin-top:12px}

/* ============ BOOKING ============ */
.bk-top{padding:40px 0 32px;border-bottom:1px solid var(--hairline)}
.stepper{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:40px}
.stepper button{text-align:left;display:flex;flex-direction:column;justify-content:flex-start;align-items:flex-start;padding-top:14px;border-top:2px solid var(--hairline);color:var(--ink-muted)}
.stepper button.on{border-top-color:var(--ink);color:var(--ink)}
.stepper button.done{border-top-color:var(--ink);color:var(--ink)}
.stepper .s{display:block}
.stepper .t{display:block;font-size:17px;font-weight:500;margin-top:4px;letter-spacing:-.01em}
.stepper-m{display:none}
.bk{padding:48px 0 var(--space-10);align-items:start}
.bk-main{grid-column:1/8}
.bk-main h2{margin-bottom:28px}
.bk-side{grid-column:9/13;position:sticky;top:calc(var(--nav-h) + 24px);background:var(--canvas);padding:28px}
.bk-side .frame{aspect-ratio:16/10;background:var(--stone)}
.bk-side .frame svg.bag{height:84%;margin-bottom:4%}
.sum{margin:20px 0 0;font-size:14px}
.sum div{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--hairline)}
.sum dt{color:var(--ink-muted)}
.sum dd{margin:0;text-align:right}
.sum .tot{border-bottom:0;padding-top:16px;font-size:18px;font-weight:500}
.sum .tot dt{color:var(--ink)}
.bk-nav{display:flex;justify-content:space-between;align-items:center;margin-top:40px;padding-top:24px;border-top:1px solid var(--hairline)}
.opt{display:grid;grid-template-columns:120px 1fr auto;gap:24px;align-items:center;padding:16px;border:1px solid var(--hairline);margin-bottom:12px;width:100%;text-align:left;transition:border-color .2s}
.opt:hover{border-color:var(--ink-muted)}
.opt.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt .frame{aspect-ratio:1/1;height:auto}
.opt .frame svg.bag{height:80%;margin-bottom:6%}
.opt .nm{font-family:var(--font-display);font-size:22px;letter-spacing:-.03em;font-weight:500}
.opt .radio{width:20px;height:20px;border-radius:50%;border:1px solid var(--ink);display:flex;align-items:center;justify-content:center}
.opt.on .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--ink)}
.field{display:block;margin-bottom:20px}
.field .l{display:block;font-size:13px;color:var(--ink-muted);margin-bottom:8px}
.field input,.field textarea{width:100%;height:52px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);padding:0 16px;background:var(--paper);font-size:15px;transition:border-color .2s}
.field textarea{height:96px;padding:14px 16px;resize:vertical}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.note{background:var(--canvas);padding:16px 18px;font-size:14px;color:var(--charcoal);display:flex;gap:12px}
.agree{display:flex;gap:12px;align-items:flex-start;margin-top:24px;font-size:14px;cursor:pointer}
.agree input{width:18px;height:18px;accent-color:var(--ink);margin-top:3px}
.done-pg{padding-top:var(--space-10);padding-bottom:var(--space-10)}
.done-pg .ticket{max-width:560px;margin-top:56px;border:1px solid var(--ink)}
.done-pg .ticket .top{background:var(--ink);color:var(--paper);padding:20px 24px;display:flex;justify-content:space-between;align-items:center}
.done-pg .ticket dl{margin:0;padding:8px 24px 16px}
.done-pg .ticket dl div{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px dashed var(--hairline);font-size:15px}
.done-pg .ticket dl div:last-child{border-bottom:0}
.done-pg .ticket dt{color:var(--ink-muted)}
.done-pg .ticket dd{margin:0}
.bk-bar{display:none}

/* ============ prototype chrome (not part of the design) ============ */
.vp{position:fixed;right:20px;bottom:20px;z-index:100;display:flex;gap:2px;background:#111;padding:4px;border-radius:999px;font-family:"Inter Tight",sans-serif;font-size:12px;letter-spacing:.06em}
.vp button{color:#aaa;padding:8px 14px;border-radius:999px}
.vp button.on{background:#fff;color:#111}
html.m body{background:#d8d5ce}
html.m #app{width:390px;height:calc(100vh - 48px);margin:24px auto;overflow-y:auto;overflow-x:hidden;min-height:0;border-radius:28px;outline:8px solid #111;scrollbar-width:none}
html.m #app::-webkit-scrollbar{display:none}
html.m .menu-sheet{position:absolute;left:0;right:0;bottom:auto}
html.m #app.lock{overflow:hidden}

/* ============ responsive: tablet ============ */
@container app (max-width:1080px){
  .wrap{padding:0 32px}
  .hero-copy{grid-column:1/7}
  .hero-visual{grid-column:7/13}
  .nav-links{gap:24px}
  .ring-wrap{grid-column:1/7}
  .proc-list{grid-column:7/13}
  .pd-gallery{grid-column:1/7}
  .pd-panel{grid-column:7/13}
  .bk-main{grid-column:1/8}
  .bk-side{grid-column:8/13}
}
@container app (max-width:860px){
  .nav-links{display:none}
}

/* ============ responsive: mobile ============ */
@container app (max-width:720px){
  :root,#app{--nav-h:60px}
  .wrap{padding:0 20px}
  .grid{grid-template-columns:minmax(0,1fr);row-gap:0}
  .grid>*{grid-column:1/-1 !important}
  .sec{padding:var(--space-9) 0}
  .sec-tight{padding:var(--space-8) 0}
  .nav-in{height:60px}
  .nav-links,.nav .btn{display:none}
  .nav-menu{display:inline-flex}
  .lead{font-size:16px}

  .hero{padding-top:8px;padding-bottom:40px}
  .hero .grid{min-height:0}
  .hero-copy{padding:24px 0 32px}
  .hero-copy .lead{margin-top:20px}
  .hero-actions{margin-top:28px}
  .hero-actions .btn{width:100%}
  .hero-loop{margin-top:28px}
  .hero-visual{min-height:440px;margin:0 -20px}
  .hero-meta .mono:last-child{display:none}

  .why-note{margin-top:24px}
  .why-frames{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 20px;gap:12px;margin:48px -20px 0;padding:0 20px;scrollbar-width:none}
  .why-frames figure{flex:0 0 72%;scroll-snap-align:start}
  .why-rail{display:none}

  .proc-body{margin-top:48px}
  .ring-wrap{max-width:340px;margin:0 auto 40px}
  .ring-label{display:none}

  .col-head .r{margin-top:20px}
  .cards{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 20px;gap:12px;margin:40px -20px 0;padding:0 20px;scrollbar-width:none}
  .cards .pcard{flex:0 0 84%;scroll-snap-align:start}
  .pcard-name{font-size:22px}

  .story-head .r{margin-top:24px;justify-self:start}
  .story-body{margin-top:48px}
  .compare{margin:0 -20px 40px}
  .ptag{padding:22px}
  .ptag .stripe{margin:-22px -22px 20px}
  .ptag .id{font-size:24px}
  .tl li{grid-template-columns:76px 1fr}

  .rent-r{margin-top:40px}
  .rent-r li{grid-template-columns:40px 1fr;padding:24px 0}

  .cta-copy .d-l{font-size:30px}
  .cta-copy .btn{width:100%;margin-top:40px}
  .br-d{display:none}
  .cta-art{justify-content:center;margin-top:40px;margin-bottom:calc(-1 * var(--space-9))}
  .cta-art svg{height:300px}

  .foot .grid>div{margin-bottom:32px}
  .foot .bottom{flex-direction:column;gap:6px;margin-top:24px}

  /* product */
  .crumb{display:none}
  .pd-gallery{margin:0 -20px}
  .pd-thumbs{padding:0 20px;grid-template-columns:repeat(4,1fr);gap:8px}
  .pd-panel{position:static;padding-top:32px}
  .spec{margin-top:32px}
  .spec div{grid-template-columns:110px 1fr}
  .steps4{grid-template-columns:1fr 1fr;gap:28px 16px}
  .steps4 .t{margin-top:16px}
  .pd-sec{padding-top:var(--space-9)}
  .pd-bar{display:flex;position:sticky;bottom:0;z-index:30;background:var(--paper);border-top:1px solid var(--hairline);padding:12px 20px;gap:16px;align-items:center;justify-content:space-between}
  .pd-bar .p{font-size:17px;font-weight:500}
  .pd-bar .btn{flex:1;max-width:200px}
  .foot.has-bar{padding-bottom:40px}

  /* calendar & booking */
  .cal-months{--m:1 !important}
  .cal-months .cal-m:nth-child(2){display:none}
  .bk-top{padding:20px 0 16px}
  .bk-top .d-m{font-size:26px}
  .stepper{display:none}
  .stepper-m{display:block;margin-top:16px}
  .stepper-m .bar{height:2px;background:var(--hairline);margin-top:10px;position:relative}
  .stepper-m .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink);transition:width .4s var(--ease)}
  .bk{padding-top:32px}
  .bk-side{display:none}
  .bk-nav{display:none}
  .bk-bar{display:flex;position:sticky;bottom:0;z-index:30;background:var(--paper);border-top:1px solid var(--hairline);padding:12px 20px;gap:12px;align-items:center}
  .bk-bar .tt{flex:1;font-size:13px;color:var(--ink-muted);line-height:1.35}
  .bk-bar .tt b{display:block;font-size:17px;color:var(--ink);font-weight:500}
  .opt{grid-template-columns:72px 1fr auto;gap:14px;padding:12px}
  .opt .nm{font-size:18px}
  .row2{grid-template-columns:1fr}
  .done-pg .ticket .top{flex-direction:column;align-items:flex-start;gap:4px}
}

/* ============ V2 — brand photography ============ */
.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.frame .corner{z-index:1}

/* hero: full-bleed photo, copy set on the darker lower third */
.hero2{position:relative;height:clamp(620px,calc(100vh - var(--nav-h)),880px);overflow:hidden;background:var(--night);color:var(--on-night);--focus:var(--on-night)}
.hero2::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(0deg,rgba(18,18,17,.9) 0%,rgba(18,18,17,.76) 38%,rgba(18,18,17,.34) 60%,rgba(18,18,17,0) 76%)}
.hero2>*:not(.ph){position:relative;z-index:2}
.hero2-top{position:absolute !important;top:28px;left:0;right:0;display:flex;justify-content:space-between;gap:16px;color:var(--on-night)}
.hero2-in{position:absolute !important;left:0;right:0;bottom:84px}
.hero2-copy{grid-column:5/13}
.hero2 .d-xl{font-size:clamp(40px,5.4cqi,80px);color:var(--on-night)}
.hero2 .lead{color:var(--on-night);margin-top:24px;max-width:440px}
.hero2 .hero-actions{margin-top:40px}
.hero2 .link-arrow{color:var(--on-night)}
.hero2-loop{position:absolute !important;left:0;right:0;bottom:30px;display:flex;flex-wrap:wrap;gap:8px 10px;color:var(--on-night-muted)}
.hero2-loop b{color:var(--on-night);font-weight:500}

/* story: hand + carrier portrait beside the statement */
.story-head .l{grid-column:1/8}
.story-line{font-family:var(--font-display);font-size:clamp(22px,2.3cqi,32px);line-height:1.4;letter-spacing:-.025em;font-weight:500;margin-top:48px;color:var(--on-night)}
.story-note{margin-top:20px;max-width:440px}
.story-fig{grid-column:9/13;margin:0;align-self:end}
.story-fig .ph{position:relative;aspect-ratio:3/4;height:auto;background:var(--night-raised)}
.story-fig figcaption{margin-top:14px}

/* why rent: traveler portrait left, argument right */
.rent2{align-items:start}
.rent-fig{grid-column:1/6;margin:0}
.rent-fig .ph{position:relative;aspect-ratio:3/4;height:auto;background:var(--stone)}
.rent-fig figcaption{margin-top:14px}
.rent-txt{grid-column:7/13}
.rent-txt .rent-r{margin-top:56px}

@container app (max-width:1080px){
  .hero2-copy{grid-column:4/13}
}
@container app (max-width:720px){
  .hero2{height:auto;display:flex;flex-direction:column}
  .hero2 .ph{position:relative;height:440px;object-position:22% 50% !important}
  .hero2::after{background:linear-gradient(0deg,var(--night) 0%,var(--night) calc(100% - 440px),rgba(18,18,17,.55) calc(100% - 440px + 1px),rgba(18,18,17,0) calc(100% - 260px))}
  .hero2-top{top:20px;flex-direction:column;gap:4px}
  .hero2-in{position:relative !important;bottom:auto;padding-top:32px}
  .hero2 .d-xl{font-size:38px}
  .hero2 .lead{margin-top:16px}
  .hero2 .hero-actions{margin-top:28px}
  .hero2 .hero-actions .btn{width:100%}
  .hero2-loop{position:relative !important;bottom:auto;padding-top:28px;padding-bottom:36px}
  .story-line{margin-top:28px}
  .story-fig{margin:40px -20px 0}
  .story-fig figcaption{padding:0 20px}
  .story-fig .ph{aspect-ratio:4/5}
  .rent-fig{margin:0 -20px 48px}
  .rent-fig figcaption{padding:0 20px}
  .rent-fig .ph{aspect-ratio:4/5}
  .rent-txt .rent-r{margin-top:40px}
}
.story-head .d-latin{font-size:clamp(44px,6.6cqi,104px)}

</style>
</head>
<body>

  <main id="view"></main>
  <div id="foot"></div>
</div>

function bag(o){
  o = Object.assign({color:'graphite',bw:160,bh:250,handle:'up',ext:64,tag:false,worn:false,vb:null,tagColor:'#c4592b',cls:'bag',style:'',label:'RECARRY 캐리어'},o);
  const c = COL[o.color], u = 'g'+(++UID);
  const W=240, bw=o.bw, bh=o.bh, x=(W-bw)/2, cx=W/2, top=110, bot=top+bh, H=bot+46;
  const ext = o.handle==='up'?o.ext:0, gy = top-16-ext;
  let s = `<defs>
  <linearGradient id="${u}s" x1="0" x2="1"><stop offset="0" stop-color="${c.light}"/><stop offset=".14" stop-color="${c.shell}"/><stop offset=".8" stop-color="${c.shell}"/><stop offset="1" stop-color="${c.dark}"/></linearGradient>
  <linearGradient id="${u}v" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".12"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".12"/></linearGradient>
  <linearGradient id="${u}r" x1="0" x2="1"><stop offset="0" stop-color="${c.light}"/><stop offset=".55" stop-color="${c.shell}"/><stop offset="1" stop-color="${c.dark}"/></linearGradient>
  <linearGradient id="${u}m" x1="0" x2="1"><stop offset="0" stop-color="#8a8a88"/><stop offset=".5" stop-color="#dcdcd9"/><stop offset="1" stop-color="#737371"/></linearGradient>
  ${o.worn?`<filter id="${u}f"><feColorMatrix type="saturate" values=".3"/></filter>`:''}</defs>`;
  s += `<ellipse cx="${cx}" cy="${bot+32}" rx="${bw*.74}" ry="9" fill="#000" opacity=".07"/><ellipse cx="${cx}" cy="${bot+31}" rx="${bw*.56}" ry="4.5" fill="#000" opacity=".17"/>`;
  s += `<g ${o.worn?`filter="url(#${u}f)"`:''}>`;
  if(ext>0){
    s += `<rect x="${cx-27}" y="${gy+12}" width="5" height="${top-gy-12}" fill="url(#${u}m)"/><rect x="${cx+22}" y="${gy+12}" width="5" height="${top-gy-12}" fill="url(#${u}m)"/>`;
  }
  s += `<rect x="${cx-36}" y="${gy}" width="72" height="16" rx="8" fill="#1c1c1b"/>`;
  s += `<rect x="${cx-42}" y="${top-5}" width="84" height="9" rx="3" fill="${c.dark}"/>`;
  [x+8, x+bw-38].forEach((hx,i)=>{
    s += `<rect x="${hx}" y="${bot-6}" width="30" height="16" rx="4" fill="#1e1e1d"/>`;
    if(!(o.worn && i===1)) s += `<circle cx="${hx+15}" cy="${bot+17}" r="11" fill="#1a1a19"/><circle cx="${hx+15}" cy="${bot+17}" r="4" fill="#4a4a48"/>`;
  });
  s += `<rect x="${x}" y="${top}" width="${bw}" height="${bh}" rx="18" fill="url(#${u}s)"/><rect x="${x}" y="${top}" width="${bw}" height="${bh}" rx="18" fill="url(#${u}v)"/>`;
  s += `<rect x="${x+5}" y="${top+5}" width="${bw-10}" height="${bh-10}" rx="14" fill="none" stroke="${c.dark}" stroke-opacity=".28"/>`;
  [.22,.5,.78].forEach(p=>{ const rx=x+bw*p-7;
    s += `<rect x="${rx}" y="${top+22}" width="14" height="${bh-44}" rx="7" fill="url(#${u}r)"/><rect x="${rx+15}" y="${top+26}" width="1.2" height="${bh-52}" fill="${c.dark}" opacity=".45"/>`; });
  if(o.worn){
    s += `<rect x="${x}" y="${top}" width="${bw}" height="${bh}" rx="18" fill="#8d877b" opacity=".28"/>`;
    s += `<ellipse cx="${x+bw*.3}" cy="${bot-40}" rx="34" ry="18" fill="#6f685d" opacity=".35"/><ellipse cx="${x+bw*.75}" cy="${top+70}" rx="22" ry="30" fill="#6f685d" opacity=".25"/>`;
    s += `<path d="M${x+22} ${top+64} l30 -9 M${x+bw-54} ${top+140} l22 12 M${x+34} ${bot-78} l34 5 M${x+bw*.55} ${top+40} l-14 26" stroke="#fff" stroke-opacity=".55" stroke-width="1.3"/>`;
    s += `<g transform="rotate(-6 ${x+bw*.36} ${top+bh*.5})"><rect x="${x+bw*.2}" y="${top+bh*.46}" width="46" height="26" fill="#ece6d8" opacity=".85"/><rect x="${x+bw*.2+6}" y="${top+bh*.46+7}" width="30" height="3" fill="#8d877b"/><rect x="${x+bw*.2+6}" y="${top+bh*.46+14}" width="20" height="3" fill="#8d877b"/></g>`;
  }
  s += `</g>`;
  if(o.tag){
    s += `<path d="M${cx+28} ${top-3} C ${cx+46} ${top-8}, ${cx+58} ${top+12}, ${cx+58} ${top+30}" stroke="#1c1c1b" stroke-width="1.4" fill="none"/>`;
    s += `<g transform="translate(${cx+43} ${top+28}) rotate(9)"><rect width="30" height="50" rx="3" fill="${o.tagColor}"/><circle cx="15" cy="8" r="2.8" fill="#1c1c1b" opacity=".55"/><rect x="6" y="18" width="18" height="2" fill="#fff" opacity=".9"/><rect x="6" y="24" width="12" height="2" fill="#fff" opacity=".65"/><rect x="6" y="36" width="2" height="8" fill="#fff"/><rect x="10" y="36" width="1" height="8" fill="#fff"/><rect x="13" y="36" width="3" height="8" fill="#fff"/><rect x="18" y="36" width="1" height="8" fill="#fff"/><rect x="21" y="36" width="2" height="8" fill="#fff"/></g>`;
  }
  const geo = {x,cx,top,bot,gy,H};
  const vb = typeof o.vb==='function' ? o.vb(geo) : (o.vb || `0 0 ${W} ${H}`);
  return `<svg class="${o.cls}" style="${o.style}" viewBox="${vb}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${o.label}" preserveAspectRatio="xMidYMid ${o.vb?'slice':'meet'}">${s}</svg>`;
}
const pbag = (p,extra) => bag(Object.assign({color:p.color,bw:p.bw,bh:p.bh,label:p.name},extra||{}));

/* ---------- photography slots ----------
   photo(): a cover-cropped image that fills its parent frame. Tune the crop with object-position only.
   media(): product slot. Uses p.photo when set (studio shot, 4:5, carrier ~70% of frame height),
            otherwise falls back to the illustrated carrier — swap-in needs no layout change. */

function ringSVG(){
  const c=280, r=200, C=2*Math.PI*r;
  let nodes='', labels='';
  STEPS.forEach((st,i)=>{
    const a=(-90+i*60)*Math.PI/180, nx=c+r*Math.cos(a), ny=c+r*Math.sin(a);
    nodes += `<circle class="ring-node" id="rn${i}" cx="${nx.toFixed(1)}" cy="${ny.toFixed(1)}" r="6"/>`;
    const lx=c+(r+40)*Math.cos(a), ly=c+(r+40)*Math.sin(a)+4;
    const anchor = Math.abs(Math.cos(a))<.2 ? 'middle' : (Math.cos(a)>0?'start':'end');
    labels += `<text class="ring-label" id="rl${i}" x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="${anchor}">${st.e}</text>`;
  });
  return `<svg viewBox="-80 0 720 560" aria-hidden="true">
    <circle class="ring-track" cx="${c}" cy="${c}" r="${r}"/>
    <circle class="ring-prog" id="rprog" cx="${c}" cy="${c}" r="${r}" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${C.toFixed(1)}" transform="rotate(-90 ${c} ${c})"/>
    ${nodes}${labels}
    <g class="ring-traveler" id="trav" style="transform-origin:280px 280px"><circle cx="280" cy="80" r="11" fill="var(--signal)"/></g>
  </svg>`;
}

/* ---------- calendar ---------- */
function monthHTML(base){
  const y=base.getFullYear(), m=base.getMonth(), first=new Date(y,m,1).getDay(), n=new Date(y,m+1,0).getDate();
  let cells = DAYS.map(d=>`<span class="wd">${d}</span>`).join('');
  for(let i=0;i<first;i++) cells+='<span></span>';
  for(let d=1; d<=n; d++){
    const dt=new Date(y,m,d), cls=[];
    const past = dt<=today;
    if(S.start && +dt===+S.start){ cls.push('s'); if(!S.end) cls.push('e'); }
    if(S.end && +dt===+S.end) cls.push('e');
    if(S.start && S.end && dt>S.start && dt<S.end) cls.push('in');
    if(+dt===+today) cls.push('today');
    cells += `<button class="${cls.join(' ')}" data-act="day" data-d="${ymd(dt)}" ${past?'disabled':''} aria-label="${fmt(dt)}"><span>${d}</span></button>`;
  }
  return `<div class="cal-m"><h4>${y}년 ${m+1}월</h4><div class="cal-g">${cells}</div></div>`;
}
function calendar(m){
  const months=[]; for(let i=0;i<m;i++) months.push(new Date(S.calBase.getFullYear(), S.calBase.getMonth()+i, 1));
  const atMin = S.calBase.getFullYear()===today.getFullYear() && S.calBase.getMonth()===today.getMonth();
  const status = !S.start ? '출발일을 선택하세요' : !S.end ? '도착일을 선택하세요' : `${fmt(S.start)} — ${fmt(S.end)}`;
  return `<div class="cal"><div class="cal-top"><button data-act="cal-prev" aria-label="이전 달" ${atMin?'disabled style="opacity:.3"':''}>‹</button><span class="small" style="color:var(--ink)">${status}</span><button data-act="cal-next" aria-label="다음 달">›</button></div>
    <div class="cal-months" style="--m:${m}">${months.map(monthHTML).join('')}</div></div>`;
}

/* ---------- router ---------- */
const app = ()=>$('#app');
const scroller = ()=> S.mobile ? app() : window;
function scrollTop(y,smooth){ scroller().scrollTo({top:y,behavior:smooth?'smooth':'auto'}); }
function scrollToId(id){
  const el=document.getElementById(id); if(!el) return;
  const base = S.mobile ? app().getBoundingClientRect().top - app().scrollTop : -window.scrollY;
  const navH = $('#nav').offsetHeight;
  scrollTop(el.getBoundingClientRect().top - base - navH + 1, true);
}
function route(){
  clearInterval(timer); closeMenu();
  const h = location.hash || '#/';
  const view = $('#view');
  let isHome=false;
  if(h.startsWith('#/product/')){ view.innerHTML = productHTML(h.split('/')[2]); S.product=h.split('/')[2]||'24'; }
  else if(h==='#/booking'){ view.innerHTML = bookingHTML(); }
  else if(h==='#/done'){ view.innerHTML = doneHTML(); }
  else { view.innerHTML = homeHTML(); isHome=true; }
  if(isHome) startProc();
  if(isHome && S.pendingAnchor){ const t=S.pendingAnchor; S.pendingAnchor=null; requestAnimationFrame(()=>{ scrollTop(0); scrollToId(t); }); }
  else scrollTop(0);
  onScroll();
}

/* ---------- process ring ---------- */
function startProc(){
  S.pi=0; S.rot=0; updateProc();
  const how=$('#how');
  how.addEventListener('mouseenter',()=>procHover=true);
  how.addEventListener('mouseleave',()=>procHover=false);
  timer=setInterval(()=>{ if(!procHover && !document.hidden) goProc((S.pi+1)%6); },3200);
}
function goProc(i){ const d=(i-S.pi+6)%6; S.rot+=d*60; S.pi=i; updateProc(); }
function updateProc(){
  const i=S.pi, C=2*Math.PI*200, st=STEPS[i];
  const prog=$('#rprog'); if(!prog) return;
  prog.style.strokeDashoffset = (C*(1-i/6)).toFixed(1);
  STEPS.forEach((_,j)=>{ $('#rn'+j).classList.toggle('done',j<=i); $('#rl'+j).classList.toggle('on',j===i); });
  $('#trav').style.transform = `rotate(${S.rot}deg)`;
  $('#ringc').innerHTML = `<span class="n">0${i+1} / 06</span><span class="w">${st.k}</span><span class="e">${st.e}</span>`;
  document.querySelectorAll('#plist li').forEach((li,j)=>li.classList.toggle('on',j===i));
}

function openMenu(){
  const m=$('#menu');
  if(S.mobile){ m.style.top=app().scrollTop+'px'; m.style.height=app().clientHeight+'px'; app().classList.add('lock'); }
  m.classList.add('open');
}
function closeMenu(){ const m=$('#menu'); if(!m) return; m.classList.remove('open'); app().classList.remove('lock'); m.style.top=''; m.style.height=''; }

function pickDay(d){
  if(!S.start || (S.start && S.end)){ S.start=d; S.end=null; }
  else if(d<=S.start){ S.start=d; }
  else { S.end=d; }
}
function validate(){
  if(S.step===1 && !(S.start&&S.end)) return '출발일과 도착일을 모두 선택해주세요.';
  if(S.step===3){ const f=S.form; if(!f.name.trim()||!f.phone.trim()||!f.addr.trim()) return '받는 분, 휴대폰 번호, 주소를 입력해주세요.'; }
  if(S.step===4 && !S.agree) return '대여 약관과 파손·분실 정책 확인에 동의해주세요.';
  return '';
}
function rerenderBooking(){ const y = S.mobile?app().scrollTop:window.scrollY; $('#view').innerHTML=bookingHTML(); scrollTop(y); }

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]'); if(!a) return;
  const act=a.dataset.act;
  switch(act){
    case 'to': e.preventDefault(); closeMenu();
      if((location.hash||'#/')!=='#/' && location.hash!==''){ S.pendingAnchor=a.dataset.t; location.hash='#/'; }
      else scrollToId(a.dataset.t);
      break;
    case 'menu': openMenu(); break;
    case 'menu-close': e.preventDefault(); closeMenu(); if(a.classList.contains('logo')) location.hash='#/'; break;
    case 'proc': goProc(+a.dataset.i); break;
    case 'thumb': {
      const p=P[S.product]; $('#pdmain').firstElementChild.outerHTML = galleryView(p,+a.dataset.i);
      document.querySelectorAll('.pd-thumbs button').forEach(b=>b.classList.toggle('on',b===a)); break; }
    case 'cal-toggle': S.calOpen=!S.calOpen; $('#datebox').innerHTML=dateBox(P[S.product]); break;
    case 'cal-prev': S.calBase=new Date(S.calBase.getFullYear(),S.calBase.getMonth()-1,1); refreshCal(); break;
    case 'cal-next': S.calBase=new Date(S.calBase.getFullYear(),S.calBase.getMonth()+1,1); refreshCal(); break;
    case 'day': pickDay(parse(a.dataset.d)); if(S.start&&S.end&&$('#datebox')) S.calOpen=false; refreshCal(); break;
    case 'book': S.product=a.dataset.k||S.product; S.step=(S.start&&S.end)?2:1; S.maxStep=S.step; S.agree=false; location.hash='#/booking'; break;
    case 'pick': S.product=a.dataset.k; rerenderBooking(); break;
    case 'goto': S.step=+a.dataset.s; rerenderBooking(); break;
    case 'prev': S.step=Math.max(1,S.step-1); rerenderBooking(); break;
    case 'next': {
      const err=validate(); if(err){ document.querySelectorAll('#err').forEach(x=>x.textContent=err); if(S.mobile||app().clientWidth<=720) alertBar(err); return; }
      if(S.step<4){ S.step++; S.maxStep=Math.max(S.maxStep,S.step); rerenderBooking(); scrollTop(0); }
      else {
        const p=P[S.product], d=new Date();
        S.booking={product:S.product,start:S.start,end:S.end,total:priceFor(p,nights()),phone:S.form.phone,
          code:`RC-B-${String(d.getFullYear()).slice(2)}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}-${p.id.slice(-4)}`};
        location.hash='#/done';
      }
      break; }
    case 'vp': setViewport(a.dataset.v==='m'); break;
  }
});
function alertBar(msg){ const el=$('#err'); if(el) el.scrollIntoView({block:'center',behavior:'smooth'}); }
function refreshCal(){
  if($('#datebox')) $('#datebox').innerHTML=dateBox(P[S.product]);
  else if((location.hash)==='#/booking') rerenderBooking();
}
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.f){ S.form[t.dataset.f]=t.value; }
  if(t.dataset.in==='cmp'){ const v=t.value, c=t.closest('.compare');
    c.querySelector('.after').style.clipPath=`inset(0 0 0 ${v}%)`; c.querySelector('.bar').style.left=v+'%'; c.querySelector('.knob').style.left=v+'%'; }
});
document.addEventListener('change',e=>{ if(e.target.dataset.in==='agree'){ S.agree=e.target.checked; const er=$('#err'); if(er) er.textContent=''; } });

function onScroll(){ const y = S.mobile?app().scrollTop:window.scrollY; const n=$('#nav'); if(n) n.classList.toggle('is-scrolled', y>8); }
window.addEventListener('scroll',onScroll,{passive:true});

function setViewport(m){
  S.mobile=m; document.documentElement.classList.toggle('m',m);
  document.querySelectorAll('.vp button').forEach(b=>b.classList.toggle('on',(b.dataset.v==='m')===m));
  scrollTop(0); onScroll();
}

/* ---------- boot ---------- */
document.addEventListener('DOMContentLoaded',()=>{
  $('#app').insertAdjacentHTML('afterbegin', navHTML());
  $('#foot').innerHTML = footHTML();
  $('#app').addEventListener('scroll',onScroll,{passive:true});
  window.addEventListener('hashchange',route);
  if(new URLSearchParams(location.search).get('m')==='1') setViewport(true);
  route();
});
})();

</script>
</body>
</html>
