# Render 무료 서버는 15분 동안 요청이 없으면 잠들어 첫 접속이 30~60초 걸린다 (사이즈 · 가격이 늦게 뜸).
# 10분마다 health 를 불러 깨워 둔다. health 는 DB 에 select 1 을 보내므로 Supabase 무료의 비활성 일시정지도 막는다.
# GitHub 예약 실행은 몇 분씩 밀릴 수 있다 — 확실히 하려면 UptimeRobot 같은 외부 감시를 함께 쓴다.
name: keepalive
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      # 잠든 서버는 깨는 데 60초 넘게 걸리고 Vercel 프록시는 그 전에 끊길 수 있다 → Render 를 직접, 재시도 포함.
      - run: curl -fsS -m 150 --retry 2 --retry-delay 10 --retry-all-errors https://recarry-backend.onrender.com/api/health
