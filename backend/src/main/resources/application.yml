# 모든 비밀 값은 환경변수로 받는다.
#   로컬 개발      : backend/.env 를 자동으로 읽는다 (gitignore)
#   Supabase 점검  : RECARRY_ENV_FILE=.env.prod 로 그 파일만 읽는다 (.env 는 읽지 않는다)
#   운영 서버      : 파일 없이 OS 환경변수만 쓴다
spring:
  application:
    name: recarry-backend
  lifecycle:
    timeout-per-shutdown-phase: 20s   # 재배포 SIGTERM 때 처리 중인 요청(예약 등)을 마칠 시간
  config:
    import: optional:file:${RECARRY_ENV_FILE:.env}[.properties]
  profiles:
    # .env 는 일반 property 로 읽히므로 SPRING_PROFILES_ACTIVE 를 직접 참조한다 (OS 환경변수로 줘도 된다)
    active: ${SPRING_PROFILES_ACTIVE:}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # Supabase pooler 는 연결 수 한도가 작다. 인스턴스당 작게 유지한다
      maximum-pool-size: ${DB_POOL_SIZE:5}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # 스키마는 Flyway 만 바꾼다
  flyway:
    locations: classpath:db/migration

server:
  port: ${PORT:8080}               # 대부분의 호스팅이 PORT 를 넣어준다
  shutdown: graceful               # 새 요청은 받지 않고 진행 중인 요청을 끝낸 뒤 종료
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

recarry:
  jwt:
    secret: ${JWT_SECRET}
    ttl-minutes: ${JWT_TTL_MINUTES:120}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  cookie:                          # JWT 를 담는 httpOnly 쿠키
    name: recarry_session
    secure: ${COOKIE_SECURE:true}  # https 에서만 전송. 로컬(http)은 local 프로필이 끈다
    same-site: ${COOKIE_SAME_SITE:Lax}   # 프론트·API 가 다른 사이트면 None (Secure 필수)
  login-limit:                     # 로그인 실패 제한 (인스턴스 메모리 기준)
    max-failures-per-email: 5
    max-failures-per-ip: ${LOGIN_MAX_FAILURES_PER_IP:30}   # 프록시 뒤라 IP 가 몇 개로 모이면 올린다
    window-minutes: 15
  admin:                           # 둘 다 있으면 기동 시 관리자 계정을 만들거나 승격한다
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  booking:
    zone: Asia/Seoul
    max-nights: 30                 # 기술적 상한. 사업 정책이 정해지면 바꾼다
