# 로컬 개발: sample 카탈로그를 함께 넣는다. 운영(prod)과 함께 켜면 기동하지 않는다 (ProductionGuard)
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/sample
recarry:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5175}
  cookie:
    secure: ${COOKIE_SECURE:false}   # http://localhost
  mail:
    log-only: ${MAIL_LOG_ONLY:true}  # 로컬은 메일 대신 서버 로그에 남긴다 (MAIL_API_KEY 가 없을 때만)
